name: GBYKE daily quiz
on:
  schedule:
    - cron: '30 6 * * *'      # 06:30 UTC = 07:30/08:30 NL – video is ready for approval in the morning, posted at 18:00 after approval
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          npm install && ln -sfn ../node_modules templates/node_modules
          pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/daily.py
      - name: Save calendar status
        run: |
          git config user.name "gbyke-bot"; git config user.email "bot@users.noreply.github.com"
          git add calendar.json && git commit -m "Quiz gemaakt $(date +%F)" && git push || echo "niets te committen"
