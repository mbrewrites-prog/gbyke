name: GBYKE promo video
on:
  workflow_dispatch:
    inputs:
      avatar_drive_id:
        description: 'Drive id of GBYKE_promo_avatar.mp4'
        required: true
permissions:
  contents: write
jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          npm install && ln -sfn ../node_modules templates/node_modules
          pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build promo
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PROMO_AVATAR_ID: ${{ inputs.avatar_drive_id }}
        run: python scripts/promo.py
