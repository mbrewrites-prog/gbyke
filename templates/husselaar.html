<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Pop';src:url('node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2') format('woff2');font-weight:800}
@font-face{font-family:'Pop';src:url('node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2') format('woff2');font-weight:700}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden}
#stage{--ink:#0E4A5E;position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 38% at 50% 47%, rgba(235,255,250,.6), rgba(235,255,250,0) 70%),
    linear-gradient(100deg,#8FE6C4 0%,#A3E9D3 35%,#AEDCF2 65%,#9CCFF6 100%);}
/* floor: slightly warmer / lighter band below the horizon, like the tabletop in the reference */
#floor{position:absolute;left:0;right:0;top:1180px;bottom:0;
  background:linear-gradient(180deg,rgba(255,190,200,0) 0%,rgba(250,175,195,.55) 18%,rgba(240,160,200,.75) 100%);}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:80px;right:80px;text-align:center;font-family:'Pop',sans-serif;color:#fff;
   text-shadow:0 4px 18px rgba(10,70,90,.40);opacity:0}
#title{top:260px;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-1px}
#sub{top:420px;font-weight:700;font-size:40px;line-height:1.3}
#hint{top:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      font-weight:800;font-size:76px;line-height:1.2}
#hint small{display:block;font-size:44px;letter-spacing:6px;margin-bottom:28px;font-weight:700;opacity:.9}
#timer{position:absolute;left:190px;width:700px;top:1415px;opacity:0}
#tnum{font-family:'Pop',sans-serif;font-weight:800;font-size:96px;color:#fff;text-align:center;line-height:1;
      text-shadow:0 4px 18px rgba(10,70,90,.40);margin-bottom:22px}
#track{height:26px;border-radius:13px;background:rgba(255,255,255,.38);overflow:hidden;box-shadow:inset 0 2px 5px rgba(10,70,90,.18)}
#bar{height:100%;width:100%;border-radius:13px;background:#F7C21B}
#timeup{top:1440px;font-weight:800;font-size:92px}
#answer{top:1395px;left:130px;right:130px;padding:26px 20px 30px;border-radius:36px;background:rgba(255,255,255,.82);
        color:#0E4A5E;text-shadow:none;box-shadow:0 12px 40px rgba(10,70,90,.22)}
#answer .big{font-weight:800;font-size:84px;line-height:1.1}
#answer .small{font-weight:700;font-size:36px;margin-top:10px;color:#2F7185}
#cta{top:300px;font-weight:800;font-size:78px;line-height:1.08}
#cta div{font-size:44px;font-weight:700;margin-top:22px}
#glow{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;pointer-events:none;
      background:radial-gradient(ellipse 42% 12% at 50% var(--gy,62%),rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
#game{position:absolute;left:0;right:0;top:78px;text-align:center;opacity:1}
#game span{display:inline-block;font-family:'Pop',sans-serif;font-weight:800;font-size:40px;letter-spacing:5px;padding:14px 38px 12px;border-radius:40px;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 8px 26px rgba(0,0,0,.12)}
#logo{position:absolute;left:50px;top:50px;width:150px}
</style>
</head>
<body>
<div id="stage">
  
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="glow"></div>
  <div class="t" id="title">Maak de piramide af</div>
  <div class="t" id="sub">Vul de onderste laag met 4 verschillende letters uit de lagen erboven.</div>
  <div class="t" id="hint"><div><small>HINT</small>Zo word je als het regent en je geen paraplu hebt.</div></div>
  <div id="timer"><div id="tnum">10</div><div id="track"><div id="bar"></div></div></div>
  <div class="t" id="timeup">Tijd is om!</div>
  <div class="t" id="answer"><div class="big">nati = nat</div><div class="small">a = de &nbsp;|&nbsp; ai = oog &nbsp;|&nbsp; tin = tien</div></div>
  <div class="t" id="cta">Heb jij het goed geraden?<div>Volg voor de volgende puzzel!</div></div>
  <div id="game"><span>LETTERHUSSELAAR</span></div>
  <img id="logo" src="logo.png">
</div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module" src="main_husselaar.js"></script>
</body>
</html>
